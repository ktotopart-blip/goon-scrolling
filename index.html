/* ---------- список фото из папки photos репозитория ---------- */
async function listNames(){
  try{const c=sessionStorage.getItem("ss_list");if(c)return JSON.parse(c)}catch(e){}
  let names=null;
  try{const o=location.hostname.split(".")[0];let rp=location.pathname.split("/")[1]||"";if(!rp||/\.html?$/.test(rp))rp=location.hostname;
    const r=await fetch("https://api.github.com/repos/"+o+"/"+rp+"/contents/photos");
    if(r.ok){const j=await r.json();names=j.filter(f=>f.type==="file").map(f=>f.name)}}catch(e){}
  if(!names){try{const r=await fetch("photos.json",{cache:"no-cache"});if(r.ok){const j=await r.json();if(Array.isArray(j))names=j}}catch(e){}}
  if(names){names=names.filter(n=>/\.(jpe?g|png|webp|gif|avif)$/i.test(n)).sort();try{sessionStorage.setItem("ss_list",JSON.stringify(names))}catch(e){}}
  return names}
async function listAudio(){
  try{const c=sessionStorage.getItem("ss_aud");if(c)return JSON.parse(c)}catch(e){}
  let names=null;
  try{const o=location.hostname.split(".")[0];let rp=location.pathname.split("/")[1]||"";if(!rp||/\.html?$/.test(rp))rp=location.hostname;
    const r=await fetch("https://api.github.com/repos/"+o+"/"+rp+"/contents/audio");
    if(r.ok){const j=await r.json();names=j.filter(f=>f.type==="file").map(f=>f.name)}}catch(e){}
  if(!names){try{const r=await fetch("audio.json",{cache:"no-cache"});if(r.ok){const j=await r.json();if(Array.isArray(j))names=j}}catch(e){}}
  if(names){names=names.filter(n=>/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac)$/i.test(n)).sort();try{sessionStorage.setItem("ss_aud",JSON.stringify(names))}catch(e){}}
  return names||[]}
async function init(){
  render();
  const [names,anames]=await Promise.all([listNames(),listAudio()]);
  tracks=anames.map(n=>"audio/"+encodeURIComponent(n));
  if(!names){dbState="none"}else{photos=names.map(n=>({id:n,url:"photos/"+encodeURIComponent(n),ts:0}));dbState="ok"}
  if(view==="home")render()}
init();
